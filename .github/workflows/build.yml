name: Blue and Red Door Derleme

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Proje dosyalarını kontrol et
        run: |
          ls -la
          test -f build.gradle

      - name: Modu derle
        run: gradle --no-daemon build

      - name: JAR dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: BlueAndRedDoor-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
