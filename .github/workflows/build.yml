name: Mod Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Java 17 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Java 17 Uyumlu Fabric Şablonunu İndir
      run: |
        # Java 25 zorlayan yeni main dalı yerine 1.20.1 sabit dalını çekiyoruz
        git clone --branch 1.20.1 --single-branch https://github.com/FabricMC/fabric-example-mod.git template
        
        ZIP_FILE=$(ls *.zip | head -n 1)
        unzip -o "$ZIP_FILE" -d ./unpacked

        JAVA_FILE=$(find unpacked -name "KorkuModu.java")
        JSON_FILE=$(find unpacked -name "fabric.mod.json")
        
        mkdir -p template/src/main/java/com/korkumodu
        cp "$JAVA_FILE" template/src/main/java/com/korkumodu/KorkuModu.java
        cp "$JSON_FILE" template/src/main/resources/fabric.mod.json
        
        ASSETS_DIR=$(find unpacked -type d -name "assets")
        if [ -n "$ASSETS_DIR" ]; then
          cp -r "$ASSETS_DIR" template/src/main/resources/
        fi

    - name: Derle ve Remap Yap
      run: |
        cd template
        chmod +x gradlew
        ./gradlew build --no-daemon

    - name: JAR Yükle
      uses: actions/upload-artifact@v4
      with:
        name: KorkuModu-1.20.1-JAR
        path: template/build/libs/*.jar
